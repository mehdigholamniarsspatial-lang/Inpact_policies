<div class="control"><span class="label">Text size</span>
  <div class="seg font-size" id="{{ id }}" role="group" aria-label="Chart text size">
    <button type="button" data-step="-1" aria-label="Make chart text smaller" title="Smaller text"><span class="a-small">A</span>−</button><button type="button" data-step="1" aria-label="Make chart text larger" title="Larger text"><span class="a-large">A</span>+</button>
  </div></div>
